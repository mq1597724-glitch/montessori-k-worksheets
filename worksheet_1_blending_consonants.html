<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worksheet 1: Blending Consonants</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive;
            background-color: #fff9e6;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #d946a6;
            font-size: 28px;
            margin-bottom: 30px;
        }
        .activity {
            margin-bottom: 35px;
            padding: 20px;
            border: 2px dashed #fbbf24;
            border-radius: 8px;
            background-color: #fef3c7;
        }
        .activity-title {
            font-weight: bold;
            color: #d97706;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .question {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 20px;
        }
        .image-box {
            flex-shrink: 0;
        }
        .image-box img {
            width: 100px;
            height: 100px;
            border: 2px solid #8b5cf6;
            border-radius: 5px;
            background-color: white;
        }
        .blank-line {
            flex-grow: 1;
            border-bottom: 3px solid #1f2937;
            min-height: 40px;
            display: flex;
            align-items: flex-end;
            padding-bottom: 5px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 10px;
        }
        .instruction {
            background-color: #dbeafe;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #1e40af;
            font-weight: bold;
        }
        @media print {
            body {
                background-color: white;
            }
            .container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Worksheet 1: Blending Consonants</h1>
        
        <div class="instruction">
            📝 Instructions: Look at each picture and fill in the missing letters to complete the word.
        </div>

        <!-- BL Words -->
        <div class="activity">
            <div class="activity-title">🔵 Words with "BL"</div>
            
            <div class="question">
                <div class="image-box">
                    <svg width="100" height="100" viewBox="0 0 100 100">
                        <circle cx="30" cy="30" cy="30" r="20" fill="#4f46e5"/>
                        <circle cx="30" cy="30" r="18" fill="#818cf8"/>
                        <circle cx="35" cy="25" r="5" fill="white"/>
                    </svg>
                </div>
                <div class="blank-line">BL___</div>
            </div>

            <div class="question">
                <div class="image-box">
                    <svg width="100" height="100" viewBox="0 0 100 100">
                        <rect x="10" y="40" width="80" height="40" fill="#92400e" rx="5"/>
                        <rect x="15" y="45" width="25" height="30" fill="#dc2626"/>
                        <rect x="50" y="45" width="25" height="30" fill="#dc2626"/>
                    </svg>
                </div>
                <div class="blank-line">BL___</div>
            </div>
        </div>

        <!-- CL Words -->
        <div class="activity">
            <div class="activity-title">☁️ Words with "CL"</div>
            
            <div class="question">
                <div class="image-box">
                    <svg width="100" height="100" viewBox="0 0 100 100">
                        <circle cx="25" cy="50" r="20" fill="#e5e7eb"/>
                        <circle cx="50" cy="40" r="22" fill="#e5e7eb"/>
                        <circle cx="75" cy="50" r="20" fill="#e5e7eb"/>
                    </svg>
                </div>
                <div class="blank-line">CL___</div>
            </div>

            <div class="question">
                <div class="image-box">
                    <svg width="100" height="100" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="35" fill="#ec4899"/>
                        <circle cx="50" cy="50" r="30" fill="#f472b6"/>
                        <circle cx="40" cy="40" r="5" fill="white"/>
                        <circle cx="60" cy="40" r="5" fill="white"/>
                    </svg>
                </div>
                <div class="blank-line">CL___</div>
            </div>
        </div>

        <!-- FL Words -->
        <div class="activity">
            <div class="activity-title">🌸 Words with "FL"</div>
            
            <div class="question">
                <div class="image-box">
                    <svg width="100" height="100" viewBox="0 0 100 100">
                        <circle cx="50" cy="30" r="15" fill="#ec4899"/>
                        <rect x="45" y="45" width="10" height="40" fill="#16a34a"/>
                    </svg>
                </div>
                <div class="blank-line">FL___</div>
            </div>

            <div class="question">
                <div class="image-box">
                    <svg width="100" height="100" viewBox="0 0 100 100">
                        <polygon points="50,10 80,90 20,90" fill="#fbbf24"/>
                        <polygon points="50,30 70,80 30,80" fill="#fcd34d"/>
                    </svg>
                </div>
                <div class="blank-line">FL___</div>
            </div>
        </div>

        <!-- PL Words -->
        <div class="activity">
            <div class="activity-title">🎮 Words with "PL"</div>
            
            <div class="question">
                <div class="image-box">
                    <svg width="100" height="100" viewBox="0 0 100 100">
                        <rect x="20" y="20" width="60" height="60" fill="#10b981" rx="5"/>
                        <circle cx="35" cy="35" r="8" fill="#3b82f6"/>
                        <circle cx="65" cy="35" r="8" fill="#ef4444"/>
                        <circle cx="35" cy="65" r="8" fill="#fbbf24"/>
                        <circle cx="65" cy="65" r="8" fill="#8b5cf6"/>
                    </svg>
                </div>
                <div class="blank-line">PL___</div>
            </div>

            <div class="question">
                <div class="image-box">
                    <svg width="100" height="100" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" fill="#f97316"/>
                        <circle cx="50" cy="50" r="30" fill="#fed7aa"/>
                        <circle cx="35" cy="40" r="6" fill="white"/>
                        <circle cx="65" cy="40" r="6" fill="white"/>
                        <path d="M 45 55 Q 50 60 55 55" stroke="black" stroke-width="2" fill="none"/>
                    </svg>
                </div>
                <div class="blank-line">PL___</div>
            </div>
        </div>

        <!-- GL Words -->
        <div class="activity">
            <div class="activity-title">🧤 Words with "GL"</div>
            
            <div class="question">
                <div class="image-box">
                    <svg width="100" height="100" viewBox="0 0 100 100">
                        <ellipse cx="50" cy="60" rx="30" ry="25" fill="#6366f1"/>
                        <ellipse cx="50" cy="60" rx="25" ry="20" fill="#818cf8"/>
                        <circle cx="40" cy="50" r="8" fill="#dbeafe"/>
                    </svg>
                </div>
                <div class="blank-line">GL___</div>
            </div>

            <div class="question">
                <div class="image-box">
                    <svg width="100" height="100" viewBox="0 0 100 100">
                        <rect x="15" y="25" width="70" height="50" fill="#14b8a6" rx="3"/>
                        <rect x="20" y="30" width="60" height="40" fill="#99f6e4"/>
                        <line x1="50" y1="30" x2="50" y2="70" stroke="#0d9488" stroke-width="2"/>
                        <line x1="20" y1="50" x2="80" y2="50" stroke="#0d9488" stroke-width="2"/>
                    </svg>
                </div>
                <div class="blank-line">GL___</div>
            </div>
        </div>

        <div style="margin-top: 40px; text-align: center; color: #6b7280; font-size: 12px;">
            <p>✏️ Great Job! 🌟</p>
        </div>
    </div>
</body>
</html>
